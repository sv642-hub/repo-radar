name: demo page

# Publishes the demo dashboard (Pantry Planner, a made-up project) to GitHub Pages.
# It reads only examples/demo/, so it needs no token and makes no GitHub API calls.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - name: Build the demo page
        run: |
          mkdir -p site
          uv run python skills/repo-radar/scripts/dashboard.py build \
            --data examples/demo/data.json --plan examples/demo/plan.yaml --out site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
