name: demo page

# Publishes the demo to GitHub Pages: a manager overview of three made-up repos
# (index.html), each linking to its own full dashboard, the engineer view.
# It reads only examples/demo-watch/, so it needs no token and makes no GitHub API calls.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - name: Build the demo pages
        run: |
          uv run python skills/repo-radar/scripts/dashboard.py watch \
            --list examples/demo-watch/watchlist.yaml --data-dir examples/demo-watch --out site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
